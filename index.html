<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор белья</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial; background: #fff; color: #333; height: 100vh; display: flex; }
  .sidebar { width: 280px; background: #f8f9fa; border-right: 1px solid #e0e0e0; padding: 20px; overflow-y: auto; }
  .sidebar h3 { margin-bottom: 15px; font-size: 16px; font-weight: 600; }
  .category { margin-bottom: 20px; }
  .category-title { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
  .cat-item { display: flex; gap: 4px; margin: 4px 0; }
  .item-btn { flex: 1; padding: 10px 12px; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer; text-align: left; font-size: 13px; }
  .item-btn:hover { background: #f0f0f0; }
  .item-btn .weight { color: #888; font-size: 11px; }
  .edit-btn { width: 36px; border: 1px solid #e0e0e0; background: #fff; border-radius: 4px; cursor: pointer; }
  .edit-btn:hover { background: #f0f0f0; }
  .main { flex: 1; padding: 30px 40px; overflow-y: auto; }
  .main h2 { margin-bottom: 20px; font-weight: 500; font-size: 22px; }
  .selected-row { display: flex; align-items: center; padding: 12px; margin: 8px 0; background: #f8f9fa; border-radius: 4px; flex-wrap: wrap; gap: 8px; }
  .selected-row .name { flex: 1; font-size: 14px; min-width: 120px; }
  .lbl { font-size: 12px; color: #888; display: flex; align-items: center; gap: 4px; }
  .selected-row input { width: 70px; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; text-align: center; }
  .remove { background: none; border: none; color: #999; cursor: pointer; font-size: 18px; }
  .remove:hover { color: #d32f2f; }
  .empty-state { color: #999; font-style: italic; padding: 20px; text-align: center; }
  .calc-btn { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 15px 0; }
  .calc-btn:hover { background: #333; }
  #result { padding: 15px; background: #f5f5f5; border-radius: 4px; font-weight: 500; font-size: 16px; }
  .add-custom { margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
  .add-custom input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
  .add-custom button { width: 100%; padding: 8px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
  @media (max-width: 600px) {
    body { flex-direction: column; height: auto; }
    .sidebar { width: 100%; max-height: 35vh; border-right: none; border-bottom: 1px solid #e0e0e0; }
    .main { padding: 20px; }
  }
</style>
</head>
<body>

<div class="sidebar">

  <div class="add-custom">
    <h3>➕ Добавить своё</h3>
    <input type="text" id="new_name" placeholder="Название">
    <input type="number" id="new_weight" placeholder="Вес (кг)" step="0.1">
    <button onclick="addCustom()">Добавить в каталог</button>
  </div>
</div>

<div class="main">

  <div id="result"></div>
</div>
