<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор белья</title>
<style>
  body { font-family: Arial; margin: 0; display: flex; height: 100vh; }
  .sidebar { width: 300px; background: #f5f5f5; padding: 20px; overflow-y: auto; border-right: 1px solid #ddd; }
  .cat-item { display: flex; gap: 4px; margin: 4px 0; }
  .item-btn { flex: 1; padding: 8px; text-align: left; cursor: pointer; }
  .edit-btn { width: 34px; cursor: pointer; }
  .main { flex: 1; padding: 30px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; background: #f5f5f5; padding: 10px; }
  .row input { width: 70px; padding: 5px; text-align: center; }
  .big { width: 100%; padding: 12px; background: #000; color: #fff; border: none; cursor: pointer; }
  #result { margin-top: 15px; padding: 15px; background: #eee; }
</style>
</head>
<body>

<div class="sidebar">
  <h3>📋 Каталог</h3>
  <div id="catalog"></div>
  <h3>➕ Добавить своё</h3>
  <input id="new_name" placeholder="Название"><br><br>
  <input id="new_weight" placeholder="Вес (кг)"><br><br>
  <button onclick="addCustom()">Добавить</button>
</div>

<div class="main">
  <h2>⚖️ Вычисление</h2>
  <div id="selected"><i>Кликни на вещь слева</i></div>
  <button class="big" onclick="poschitat()">Посчитать</button>
  <div id="result"></div>
</div>

<script>
var veshi = [
  {name:"Наволочка", weight:0.2},
  {name:"Простынь односпальная", weight:0.4},
  {name:"Простынь двуспальная", weight:0.6},
  {name:"Пододеяльник односпальный", weight:0.5},
  {name:"Пододеяльник двуспальный", weight:0.7},
  {name:"Наматрасник односпальный", weight:0.8},
  {name:"Наматрасник двуспальный", weight:1.2},
  {name:"Топпер односпальный", weight:1.5},
  {name:"Топпер двуспальный", weight:2.5},
  {name:"Полотенце для ног", weight:0.3},
  {name:"Полотенце для рук", weight:0.2},
  {name:"Полотенце большое", weight:0.5}
];
var selected = [];

function renderCatalog(){
  var html = "";
  for (var i = 0; i < veshi.length; i++){
    html += '<div class="cat-item">';
    html += '<button class="item-btn" onclick="add(' + i + ')">' + veshi[i].name + ' (' + veshi[i].weight + ' кг)</button>';
    html += '<button class="edit-btn" onclick="editW(' + i + ')">✎</button>';
    html += '</div>';
  }
  document.getElementById("catalog").innerHTML = html;
}

function editW(i){
  var nw = prompt("Новый вес для «" + veshi[i].name + "» (кг):", veshi[i].weight);
  if (nw !== null && !isNaN(parseFloat(nw))){
    veshi[i].weight = parseFloat(nw);
    renderCatalog();
  }
}

function add(i){
  selected.push({name: veshi[i].name, weight: veshi[i].weight, count: 0});
  renderSelected();
}

function renderSelected(){
  var html = "";
  for (var i = 0; i < selected.length; i++){
    html += '<div class="row">';
    html += '<span style="flex:1">' + selected[i].name + '</span>';
    html += 'кг/шт <input type="number" step="0.1" value="' + selected[i].weight + '" onchange="chW(' + i + ', this.value)">';
    html += 'шт <input type="number" value="' + selected[i].count + '" onchange="chC(' + i + ', this.value)">';
    html += '<button onclick="del(' + i + ')">×</button>';
    html += '</div>';
  }
  if (selected.length == 0) html = "<i>Кликни на вещь слева</i>";
  document.getElementById("selected").innerHTML = html;
}

function chW(i, v){ selected[i].weight = parseFloat(v) || 0; }
function chC(i, v){ selected[i].count = parseFloat(v) || 0; }
function del(i){ selected.splice(i, 1); renderSelected(); }

function poschitat(){
  var sht = 0, kg = 0;
  for (var i = 0; i < selected.length; i++){
    sht += selected[i].count;
    kg += selected[i].count * selected[i].weight;
  }
  document.getElementById("result").innerHTML = "📦 Всего: " + sht + " шт, ⚖️ " + kg.toFixed(2) + " кг";
}

function addCustom(){
  var n = document.getElementById("new_name").value;
  var w = parseFloat(document.getElementById("new_weight").value);
  if (!n || isNaN(w)){ alert("Введи название и вес!"); return; }
  veshi.push({name: n, weight: w});
  document.getElementById("new_name").value = "";
  document.getElementById("new_weight").value = "";
  renderCatalog();
}

renderCatalog();
</script>
</body>
</html>
