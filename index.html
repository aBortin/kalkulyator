<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор белья</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial;
    background: #fff;
    color: #333;
    height: 100vh;
    display: flex;
  }
  
  /* Левая панель — каталог */
  .sidebar {
    width: 280px;
    background: #f8f9fa;
    border-right: 1px solid #e0e0e0;
    padding: 20px;
    overflow-y: auto;
  }
  .sidebar h3 {
    margin-bottom: 15px;
    font-size: 16px;
    font-weight: 600;
  }
  .category {
    margin-bottom: 20px;
  }
  .category-title {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .item-btn {
    display: block;
    width: 100%;
    padding: 10px 12px;
    margin: 4px 0;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
    transition: all 0.2s;
  }
  .item-btn:hover {
    background: #f0f0f0;
    border-color: #999;
  }
  .item-btn .weight {
    color: #888;
    font-size: 11px;
  }
  
  /* Центральная часть — вычисления */
  .main {
    flex: 1;
    padding: 30px 40px;
    overflow-y: auto;
  }
  .main h2 {
    margin-bottom: 20px;
    font-weight: 500;
    font-size: 22px;
  }
  .selected-items {
    margin-bottom: 20px;
  }
  .selected-row {
    display: flex;
    align-items: center;
    padding: 12px;
    margin: 8px 0;
    background: #f8f9fa;
    border-radius: 4px;
  }
  .selected-row .name {
    flex: 1;
    font-size: 14px;
  }
  .selected-row .weight-info {
    color: #888;
    font-size: 12px;
    margin-right: 15px;
  }
  .selected-row input {
    width: 70px;
    padding: 6px 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
    text-align: center;
  }
  .selected-row .remove {
    margin-left: 10px;
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 18px;
    padding: 0 8px;
  }
  .selected-row .remove:hover {
    color: #d32f2f;
  }
  
  .empty-state {
    color: #999;
    font-style: italic;
    padding: 20px;
    text-align: center;
  }
  
  .calc-btn {
    width: 100%;
    padding: 12px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    margin: 15px 0;
  }
  .calc-btn:hover {
    background: #333;
  }
  
  #result {
    padding: 15px;
    background: #f5f5f5;
    border-radius: 4px;
    font-weight: 500;
    font-size: 16px;
  }
  
  .add-custom {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #e0e0e0;
  }
  .add-custom input {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    border: 1px solid #ddd;
    border-radius: 4px;
  }
  .add-custom button {
    width: 100%;
    padding: 8px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 5px;
  }
</style>
</head>
<body>

<!-- ЛЕВАЯ ПАНЕЛЬ: КАТАЛОГ -->
<div class="sidebar">
  <h3>📋 Каталог</h3>
  <div id="catalog"></div>
  
  <div class="add-custom">
    <h3>➕ Добавить своё</h3>
    <input type="text" id="new_name" placeholder="Название">
    <input type="number" id="new_weight" placeholder="Вес (кг)" step="0.1">
    <button onclick="addCustom()">Добавить в каталог</button>
  </div>
</div>

<!-- ЦЕНТР: ВЫЧИСЛЕНИЯ -->
<div class="main">
  <h2> Вычисление</h2>
  <div id="selected" class="selected-items">
    <div class="empty-state">Кликни на позицию слева, чтобы добавить</div>
  </div>
  
  <button class="calc-btn" onclick="poschitat()">Посчитать</button>
  <div id="result"></div>
</div>

<script>
// Каталог вещей (категории + позиции)
var catalog = {
  "Постельное": [
    { name: "Наволочка", weight: 0.2 },
    { name: "Простынь односпальная", weight: 0.4 },
    { name: "Простынь двуспальная", weight: 0.6 },
    { name: "Пододеяльник односпальный", weight: 0.5 },
    { name: "Пододеяльник двуспальный", weight: 0.7 },
    { name: "Наматрасник односпальный", weight: 0.8 },
    { name: "Наматрасник двуспальный", weight: 1.2 },
    { name: "Топпер односпальный", weight: 1.5 },
    { name: "Топпер двуспальный", weight: 2.5 }
  ],
  "Полотенца": [
    { name: "Полотенце для ног односпальное", weight: 0.3 },
    { name: "Полотенце для ног двуспальное", weight: 0.4 },
    { name: "Полотенце для рук односпальное", weight: 0.2 },
    { name: "Полотенце для рук двуспальное", weight: 0.3 },
    { name: "Полотенце большое односпальное", weight: 0.5 },
    { name: "Полотенце большое двуспальное", weight: 0.7 }
  ]
};

// Выбранные позиции (id, name, weight, count)
var selected = [];
var nextId = 0;

// Отрисовать каталог слева
function renderCatalog() {
  var box = document.getElementById("catalog");
  box.innerHTML = "";
  for (var cat in catalog) {
    var catDiv = document.createElement("div");
    catDiv.className = "category";
    catDiv.innerHTML = '<div class="category-title">' + cat + '</div>';
    for (var i = 0; i < catalog[cat].length; i++) {
      var item = catalog[cat][i];
      var btn = document.createElement("button");
      btn.className = "item-btn";
      btn.innerHTML = item.name + '<br><span class="weight">' + item.weight + ' кг/шт</span>';
      btn.onclick = (function(item) {
        return function() { addToSelected(item); };
      })(item);
      catDiv.appendChild(btn);
    }
    box.appendChild(catDiv);
  }
}

// Добавить в центральную панель
function addToSelected(item) {
  selected.push({
    id: nextId++,
    name: item.name,
    weight: item.weight,
    count: 0
  });
  renderSelected();
}

// Удалить из центральной панели
function removeFromSelected(id) {
  selected = selected.filter(function(s) { return s.id !== id; });
  renderSelected();
}

// Отрисовать выбранные позиции
function renderSelected() {
  var box = document.getElementById("selected");
  if (selected.length === 0) {
    box.innerHTML = '<div class="empty-state">Кликни на позицию слева, чтобы добавить</div>';
    return;
  }
  box.innerHTML = "";
  for (var i = 0; i < selected.length; i++) {
    var s = selected[i];
    var row = document.createElement("div");
    row.className = "selected-row";
    row.innerHTML = 
      '<div class="name">' + s.name + '</div>' +
      '<div class="weight-info">' + s.weight + ' кг/шт</div>' +
      '<input type="number" id="count_' + s.id + '" value="' + s.count + '" min="0" onchange="updateCount(' + s.id + ', this.value)">' +
      '<button class="remove" onclick="removeFromSelected(' + s.id + ')">×</button>';
    box.appendChild(row);
  }
}

// Обновить количество
function updateCount(id, value) {
  for (var i = 0; i < selected.length; i++) {
    if (selected[i].id === id) {
      selected[i].count = parseFloat(value) || 0;
      break;
    }
  }
}

// Посчитать
function poschitat() {
  var vsego_shtuk = 0;
  var vsego_kg = 0;
  for (var i = 0; i < selected.length; i++) {
    vsego_shtuk += selected[i].count;
    vsego_kg += selected[i].count * selected[i].weight;
  }
  document.getElementById("result").innerHTML = 
    "📦 Всего: " + vsego_shtuk + " шт<br>⚖️ Вес: " + vsego_kg.toFixed(2) + " кг";
}

// Добавить свою позицию в каталог
function addCustom() {
  var name = document.getElementById("new_name").value;
  var weight = parseFloat(document.getElementById("new_weight").value);
  if (name === "" || isNaN(weight)) { alert("Введи название и вес!"); return; }
  if (!catalog["Своё"]) catalog["Своё"] = [];
  catalog["Своё"].push({ name: name, weight: weight });
  document.getElementById("new_name").value = "";
  document.getElementById("new_weight").value = "";
  renderCatalog();
}

// Запуск
renderCatalog();
</script>
</body>
</html>
